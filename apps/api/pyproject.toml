[project]
name = "clipforge-api"
version = "0.1.0"
description = "ClipForge orchestration API"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.16,<2",
  "celery[redis]>=5.5,<6",
  "fastapi>=0.116,<1",
  "faster-whisper>=1.1,<2",
  "httpx>=0.28,<1",
  "imageio-ffmpeg>=0.6,<1",
  "keyring>=25.6,<26",
  "openai>=1.100,<3",
  "pillow>=11.3,<13",
  "pydantic-settings>=2.10,<3",
  "scrapling>=0.4.10,<0.5",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "tzdata>=2024.1",
  "uvicorn[standard]>=0.35,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1"
]
# Optional browser rendering of JS-only research pages (RESEARCH_BROWSER_FETCH=true;
# also run `playwright install chromium`).  Never needed for normal retrieval.
research-browser = [
  "scrapling[fetchers]>=0.4.10,<0.5",
]
visual = [
  "torch>=2.3,<3",
  "open-clip-torch>=2.24,<3",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["clipforge*"]
exclude = ["alembic*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
