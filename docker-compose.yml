services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: clipforge
      POSTGRES_USER: clipforge
      POSTGRES_PASSWORD: clipforge
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipforge"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports: ["6379:6379"]

  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://clipforge:clipforge@postgres:5432/clipforge
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:3000
      CLIPFORGE_AI_MODE: ${CLIPFORGE_AI_MODE:-local}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      BRAVE_SEARCH_API_KEY: ${BRAVE_SEARCH_API_KEY:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]

  worker:
    build: ./apps/api
    command: celery -A clipforge.worker.celery_app worker --loglevel=info -Q clipforge
    environment:
      DATABASE_URL: postgresql+psycopg://clipforge:clipforge@postgres:5432/clipforge
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    depends_on: [api]
    ports: ["3000:3000"]

volumes:
  postgres_data:

